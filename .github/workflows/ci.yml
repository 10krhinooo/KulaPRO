name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@v3
        with:
          # The action installs the long removed "tools" package by default and fails on
          # it. AGP downloads the platform and build tools it needs, so nothing else is
          # required here beyond an accepted licence and ANDROID_HOME on the path.
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug

  test:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@v3
        with:
          # The action installs the long removed "tools" package by default and fails on
          # it. AGP downloads the platform and build tools it needs, so nothing else is
          # required here beyond an accepted licence and ANDROID_HOME on the path.
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
      # koverVerify fails the build below the 90% bound on the logic layers.
      - run: ./gradlew testDebugUnitTest koverXmlReport koverVerify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/build/reports/kover/
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/

  lint:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@v3
        with:
          # The action installs the long removed "tools" package by default and fails on
          # it. AGP downloads the platform and build tools it needs, so nothing else is
          # required here beyond an accepted licence and ANDROID_HOME on the path.
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew lintDebug detekt
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/

  rules:
    name: Firestore security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - run: npm install -g firebase-tools
      - run: npm ci --prefix rules-tests
      # Rules run against the emulator, so no CI credentials and no real project are touched.
      - run: firebase emulators:exec --only firestore --project kulapro-test "npm test --prefix rules-tests"
